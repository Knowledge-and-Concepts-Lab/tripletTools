# ---------------------------------------------------------------------------
# tripletTools Condor workflow configuration
#
# Copy this file, edit the fields below, and pass it as the second argument
# to condor_workflow.R:
#
#   Rscript condor_workflow.R my_triplet_list.rds my_params.yml
#
# Fields under `defaults:` apply to all three stages (dimensionality search,
# learning curve, final fit) unless overridden inside that stage's own
# block. seed/geometry/radius/norm_penalty are shared across all stages on
# purpose, so the three stages describe the same embedding space.
# ---------------------------------------------------------------------------

# Directory where output CSVs are written. Created if it doesn't exist.
output_dir: condor_output

# Base random seed. Each restart derives its own seed from this, so runs
# are independently reproducible.
seed: 1

# Embedding geometry: "euclidean" or "sphere". See train_embedding()'s
# "Spherical embeddings" section for what geometry = "sphere" means.
geometry: euclidean
radius: 1

# Non-negative number, forwarded to train_embedding()'s norm_penalty
# argument everywhere. 0 (default) leaves checkpoint selection based on
# raw test loss. See train_embedding()'s "Diagnosing outlier items"
# section before setting this above 0.
norm_penalty: 0

# --- HTCondor settings ------------------------------------------------------
condor:
  # Path to the batchtools cluster template. ~ is expanded to your home
  # directory on the submit node.
  #
  # By convention this is where the "HTCondor cluster" section of the
  # vignette has you save inst/condor/condor_apptainer.tmpl, which runs
  # every job inside the tripletTools container image (see the Dockerfile
  # and .github/workflows/docker-publish.yml at the repo root) rather than
  # assuming R/tripletTools/the conda env are pre-installed on whatever
  # execute node the job lands on -- on a shared/heterogeneous pool like
  # CHTC's, that assumption essentially never holds.
  #
  # inst/condor/condor.tmpl (pre-installed execute nodes, no container) is
  # also shipped as an alternative for the rare pool where it genuinely is
  # pre-installed everywhere; point this at a copy of that instead if so.
  template: ~/.batchtools.condor.tmpl
  # Maximum number of simultaneous Condor jobs across all three stages.
  workers: 80

# --- Shared training defaults -----------------------------------------------
# Any of these may be overridden inside dimensionality:/learning_curve:/
# final_fit: below.
defaults:
  max_epochs: 50000
  tolerance: 1e-4
  tol_window: 10000
  device: cpu          # execute nodes in the general CHTC pool have no GPU
  resources:
    request_cpus: 1
    request_memory: 4GB
    # request_disk is deliberately left unset here: condor.tmpl and
    # condor_apptainer.tmpl each fall back to a different sensible default
    # (2GB vs. 8GB, since the container template's disk footprint also has
    # to cover the pulled/unpacked image) when it isn't set explicitly.
    # Uncomment to force a specific value for both templates:
    # request_disk: 2GB
    # Only read by condor_apptainer.tmpl; ignored by condor.tmpl.
    # container_image: docker://ghcr.io/knowledge-and-concepts-lab/triplettools:latest

# --- Stage 1: dimensionality search -----------------------------------------
# One Condor job per (dimension, restart) pair -- dims * n_restarts jobs.
dimensionality:
  dims: "1:8"           # or a list, e.g. [1, 2, 3, 4, 6, 8]
  n_restarts: 10
  # Purely a post-hoc penalty on *which dimension* gets flagged best_d --
  # unlike norm_penalty above, this never changes the fits themselves.
  # Left unset here so it defaults to norm_penalty's value (see
  # estimate_dimensionality()'s best_d_norm_penalty argument); uncomment
  # to make best_d selection use a different amount of outlier-aversion
  # than the fits themselves used.
  # best_d_norm_penalty: 0
  # max_epochs: 20000   # e.g. run the search faster than the final fit

# --- Stage 2: learning curve at the dimension selected in stage 1 ----------
# One Condor job per (fraction, restart) pair -- ceil(1/by) * n_restarts jobs.
learning_curve:
  by: 0.1
  n_restarts: 10
  # max_epochs: 50000

# --- Stage 3: final embedding, fit on the full dataset ----------------------
# A single Condor job. Unlike stage 2's fraction = 1.0 fits (which still
# hold out a test set for evaluation), this is meant as the production
# embedding, so give it a generous epoch budget if you can afford to.
final_fit:
  # max_epochs: 100000
  resources:
    request_cpus: 1
    request_memory: 8GB
    # See the note on request_disk under defaults: above -- left unset so
    # each template's own default applies.
