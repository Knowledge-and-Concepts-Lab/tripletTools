# ---------------------------------------------------------------------------
# tripletTools Condor workflow configuration
#
# Copy this file, edit the fields below, and pass it as the second argument
# to condor_workflow.py on the submit node:
#
#   python3 condor_workflow.py my_triplet_data.csv my_params.yml
#
# No R installation is needed on the submit node -- only Python 3 and
# PyYAML (pip install --user pyyaml). Every fit runs inside the
# tripletTools container image via HTCondor's container universe.
#
# Fields under `defaults:` apply to all stages (dimensionality search,
# learning curve, final fit, alpha estimation, final-final fit) unless
# overridden inside that stage's own block. seed/geometry/radius/
# norm_penalty are shared across stages 1-3 on purpose, so they describe
# one coherent embedding space.
#
# Stages 4 (alpha estimation) and 5 (final-final fit) run automatically
# after stage 3 unless refit_alpha below is set to false. They are the
# Condor-scale version of run_group_embedding_workflow()'s steps 3-4
# (vignette("embedding_vignette")) -- see that function's own roxygen for
# the full rationale, and vignette("condor_workflows_vignette")'s Workflow 1
# section for the Condor-specific details.
#
# Stage 6 (summary report) runs automatically after whichever of stages
# 1-5 ran, unless generate_summary below is set to false. It writes
# summary.md (+ a sibling summary_files/ of PNGs) via
# summarize_group_embedding_run() -- same R function you'd otherwise call
# by hand against output_dir once the run finishes, just run as one more
# Condor job so it happens automatically and without needing R on the
# submit node.
# ---------------------------------------------------------------------------

# Directory (on the submit node) where all stage outputs, summaries, and
# the final embedding are written. Created if it doesn't exist.
output_dir: condor_output

# Base random seed. prepare_triplet_matrices() uses this directly, so every
# job within a stage draws from the same sampleSet == "train" pool (the
# sampleSet == "test" pool is reserved and never touched by the
# dimensionality/learning_curve stages -- see internal_test_frac below).
# Each restart's own internal_test resample and model-fit random_state are
# then derived from this seed automatically -- see condor_workflow.py's
# module docstring for the exact formulas.
seed: 1

# Embedding geometry: "euclidean" or "sphere". See train_embedding()'s
# "Spherical embeddings" section for what geometry = "sphere" means.
# Note: the learning-curve stage always fits in euclidean geometry with
# radius 1, matching estimate_learning_curve()'s own hardcoded defaults --
# these two fields only affect the dimensionality-search and final fit.
# geometry: "sphere" requires refit_alpha: false below -- estimate_group_alpha()
# (stage 4) does not currently support it.
geometry: euclidean
radius: 1

# Run stages 4-5 (alpha estimation, then the final-final fit at that alpha)
# after stage 3. Set to false to stop after stage 3's crowd-kernel
# (alpha = 1) fit instead -- e.g. for geometry: sphere, or a quicker
# crowd-kernel-only production embedding.
refit_alpha: true

# Run stage 2 (the learning curve at best_d). Set to false to skip it --
# the learning curve is purely diagnostic (how much data is enough at the
# selected dimensionality) and nothing in stages 3-5 depends on its output,
# so it's safe to turn off once you've already characterized a dataset, or
# whenever you just want the production embedding without that diagnostic.
run_learning_curve: true

# Run stage 6 (the summary report). Set to false to skip it -- e.g. if you
# plan to call summarize_group_embedding_run() yourself afterward with
# non-default arguments (a custom item_colors vector, say).
generate_summary: true

# Non-negative number, forwarded to train_embedding()'s norm_penalty
# argument everywhere. 0 (default) leaves checkpoint selection based on
# raw test loss. See train_embedding()'s "Diagnosing outlier items"
# section before setting this above 0.
norm_penalty: 0

# --- HTCondor settings -------------------------------------------------------
condor:
  # docker:// reference to the tripletTools container image, built and
  # published by .github/workflows/docker-publish.yml at the repo root.
  # Every job (all three stages) runs inside this image via
  # universe = container -- no R, conda, or tripletTools installation is
  # assumed on whatever execute node the job lands on, which matters on a
  # shared/heterogeneous pool like CHTC's.
  container_image: docker://ghcr.io/knowledge-and-concepts-lab/triplettools:latest

  # Optional: cap how many jobs run/finish concurrently within Stage 1 and
  # Stage 2, by submitting them in sequential chunks of this size instead of
  # all at once. Unset (default) submits everything together. A real
  # deployment of the sibling group-difference workflow saw jobs complete
  # with a clean exit code but an empty output file when ~100 jobs finished
  # within the same narrow window -- consistent with the file-transfer path
  # getting overloaded, not a script bug (every job's own fit/comparison is
  # automatically retried regardless, up to 5 times, whether or not this is
  # set -- see vignette("condor_workflows_vignette")'s troubleshooting
  # section). Setting batch_size reduces how often that retry is even
  # needed by capping the size of any single completion burst; it costs some
  # wall-clock time if the pool has free slots to spare, since batches run
  # sequentially rather than all in parallel.
  # batch_size: 25

# --- Shared training defaults ------------------------------------------------
# Any of these may be overridden inside dimensionality:/learning_curve:/
# final_fit: below.
defaults:
  # Proportion of the sampleSet == "train" pool held out, freshly per
  # restart, as that restart's internal_test evaluation set (early stopping
  # and the per-restart loss/accuracy used for dimensionality/best_d
  # selection). Only used by the dimensionality and learning_curve stages --
  # ignored by final_fit, which fits on the full train pool and evaluates
  # against the reserved sampleSet == "test" pool instead. What matters for
  # a stable per-restart loss estimate is the absolute number of held-out
  # triplets, not the fraction, so this can often be set lower than a
  # conventional 20% validation split once the training pool is in the
  # thousands of triplets. See sample_internal_test() and
  # estimate_dimensionality()'s "Internal test set and restart variability"
  # section for why this exists (per-restart resampling, not one fixed
  # split shared across restarts, is what makes sd_loss/the one-SE best_d
  # rule statistically meaningful).
  internal_test_frac: 0.1
  max_epochs: 50000
  tolerance: 1e-4
  tol_window: 10000
  device: cpu          # execute nodes in the general CHTC pool have no GPU
  resources:
    request_cpus: 1
    request_memory: 4GB
    request_disk: 8GB   # covers the pulled/unpacked container image

# --- Stage 1: dimensionality search ------------------------------------------
# One Condor job per (dimension, restart) pair -- dims * n_restarts jobs,
# submitted together as a single `queue ... from (...)` block.
dimensionality:
  dims: "1:8"           # or a list, e.g. [1, 2, 3, 4, 6, 8]
  n_restarts: 10
  # Purely a post-hoc penalty on *which dimension* gets flagged best_d --
  # unlike norm_penalty above, this never changes the fits themselves.
  # Left unset here so it defaults to norm_penalty's value (see
  # estimate_dimensionality()'s best_d_norm_penalty argument); uncomment
  # to make best_d selection use a different amount of outlier-aversion
  # than the fits themselves used.
  # best_d_norm_penalty: 0
  # max_epochs: 20000   # e.g. run the search faster than the final fit

# --- Stage 2: learning curve at the dimension selected in stage 1 ----------
# One Condor job per (fraction, restart) pair -- ceil(1/by) * n_restarts jobs.
# Skipped entirely if run_learning_curve: false above.
learning_curve:
  by: 0.1
  n_restarts: 10
  # max_epochs: 50000

# --- Stage 3: final embedding, fit on the full dataset ----------------------
# n_restarts Condor jobs (one restart each), submitted together as a single
# `queue ... from (...)` block -- same shape as stages 1-2. Unlike stage 2's
# fraction = 1.0 fits (which still hold out a test set for evaluation),
# this is meant to seed stage 4's alpha estimation well -- it is NOT the
# production embedding when refit_alpha is true (the default): that's
# stage 5's best_final_embedding.csv. Give it a generous epoch budget if
# you can afford to, same as any embedding refit that feeds further fitting
# downstream.
final_fit:
  # max_epochs: 100000
  # Number of independent random restarts, each its own Condor job, keeping
  # whichever gets the lowest test loss (same lowest-test-loss selection
  # rule stages 1-2 already use for restart comparisons). Unlike a serial
  # in-job loop, running each restart as its own job lets Condor schedule
  # them onto separate execute nodes -- real wall-clock parallelism, which
  # matters here since a single final-fit restart on a large dataset can be
  # slow. Default 1 preserves prior single-job behavior exactly.
  n_restarts: 1
  resources:
    request_cpus: 1
    request_memory: 8GB
    request_disk: 8GB

# --- Stage 4: alpha estimation -----------------------------------------------
# ONE Condor job (not a restart grid -- there's nothing to parallelize at
# the group level: one embedding, one alpha). Runs estimate_group_alpha()'s
# whole coordinate-ascent loop, warm-started from stage 3's
# best_embedding.csv, then folds the alpha-profiling sub-pool back into
# training (triplet_data_folded.csv, stage 5's input) once alpha is fixed.
# Skipped entirely if refit_alpha: false above.
alpha_stage:
  # Proportion of the sampleSet == "test" pool reserved to profile alpha,
  # fixed once for the whole coordinate-ascent run -- see
  # estimate_group_alpha()'s "Where alpha is profiled from" section for why
  # this needs to be disjoint from the sub-pool governing the embedding
  # refit's own early stopping (test_fit), and the earlier discussion in
  # vignette("embedding_vignette") on sizing it for your own dataset.
  alpha_test_frac: 0.5
  # Maximum coordinate-ascent iterations, and the log-alpha convergence
  # threshold -- see estimate_group_alpha()'s own defaults/docs.
  max_outer: 15
  tol_log_alpha: 0.05
  # max_epochs: 100000   # applies to every embedding refit within the loop
  resources:
    request_cpus: 1
    request_memory: 8GB
    request_disk: 8GB

# --- Stage 5: final-final embedding, the actual production embedding ------
# Same job-per-restart shape as stage 3, but fit at the now-fixed
# (best_d, alpha) on stage 4's folded data (alpha_test already moved back
# into "train") -- this is what you actually want to use downstream.
final_final_fit:
  # max_epochs: 100000
  n_restarts: 5
  resources:
    request_cpus: 1
    request_memory: 8GB
    request_disk: 8GB

# --- Stage 6: summary report --------------------------------------------
# ONE Condor job (no restart grid -- there's nothing to fit here, just a
# report to render) running summarize_group_embedding_run() against
# whichever of stages 1-5's output files exist. Cheap -- a few small CSVs
# in, a handful of base-R plots out -- so the default resources below are
# modest relative to every other stage's.
report:
  resources:
    request_cpus: 1
    request_memory: 2GB
    request_disk: 2GB
