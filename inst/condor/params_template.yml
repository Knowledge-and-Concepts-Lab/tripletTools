# ---------------------------------------------------------------------------
# tripletTools Condor workflow configuration
#
# Copy this file, edit the fields below, and pass it as the second argument
# to condor_workflow.py on the submit node:
#
#   python3 condor_workflow.py my_triplet_data.csv my_params.yml
#
# No R installation is needed on the submit node -- only Python 3 and
# PyYAML (pip install --user pyyaml). Every fit runs inside the
# tripletTools container image via HTCondor's container universe.
#
# Fields under `defaults:` apply to all three stages (dimensionality
# search, learning curve, final fit) unless overridden inside that
# stage's own block. seed/geometry/radius/norm_penalty are shared across
# all stages on purpose, so the three stages describe the same embedding
# space.
# ---------------------------------------------------------------------------

# Directory (on the submit node) where all stage outputs, summaries, and
# the final embedding are written. Created if it doesn't exist.
output_dir: condor_output

# Base random seed. prepare_triplet_matrices() uses this directly, so every
# job within a stage draws from the same sampleSet == "train" pool (the
# sampleSet == "test" pool is reserved and never touched by the
# dimensionality/learning_curve stages -- see internal_test_frac below).
# Each restart's own internal_test resample and model-fit random_state are
# then derived from this seed automatically -- see condor_workflow.py's
# module docstring for the exact formulas.
seed: 1

# Embedding geometry: "euclidean" or "sphere". See train_embedding()'s
# "Spherical embeddings" section for what geometry = "sphere" means.
# Note: the learning-curve stage always fits in euclidean geometry with
# radius 1, matching estimate_learning_curve()'s own hardcoded defaults --
# these two fields only affect the dimensionality-search and final fit.
geometry: euclidean
radius: 1

# Non-negative number, forwarded to train_embedding()'s norm_penalty
# argument everywhere. 0 (default) leaves checkpoint selection based on
# raw test loss. See train_embedding()'s "Diagnosing outlier items"
# section before setting this above 0.
norm_penalty: 0

# --- HTCondor settings -------------------------------------------------------
condor:
  # docker:// reference to the tripletTools container image, built and
  # published by .github/workflows/docker-publish.yml at the repo root.
  # Every job (all three stages) runs inside this image via
  # universe = container -- no R, conda, or tripletTools installation is
  # assumed on whatever execute node the job lands on, which matters on a
  # shared/heterogeneous pool like CHTC's.
  container_image: docker://ghcr.io/knowledge-and-concepts-lab/triplettools:latest

# --- Shared training defaults ------------------------------------------------
# Any of these may be overridden inside dimensionality:/learning_curve:/
# final_fit: below.
defaults:
  # Proportion of the sampleSet == "train" pool held out, freshly per
  # restart, as that restart's internal_test evaluation set (early stopping
  # and the per-restart loss/accuracy used for dimensionality/best_d
  # selection). Only used by the dimensionality and learning_curve stages --
  # ignored by final_fit, which fits on the full train pool and evaluates
  # against the reserved sampleSet == "test" pool instead. What matters for
  # a stable per-restart loss estimate is the absolute number of held-out
  # triplets, not the fraction, so this can often be set lower than a
  # conventional 20% validation split once the training pool is in the
  # thousands of triplets. See sample_internal_test() and
  # estimate_dimensionality()'s "Internal test set and restart variability"
  # section for why this exists (per-restart resampling, not one fixed
  # split shared across restarts, is what makes sd_loss/the one-SE best_d
  # rule statistically meaningful).
  internal_test_frac: 0.1
  max_epochs: 50000
  tolerance: 1e-4
  tol_window: 10000
  device: cpu          # execute nodes in the general CHTC pool have no GPU
  resources:
    request_cpus: 1
    request_memory: 4GB
    request_disk: 8GB   # covers the pulled/unpacked container image

# --- Stage 1: dimensionality search ------------------------------------------
# One Condor job per (dimension, restart) pair -- dims * n_restarts jobs,
# submitted together as a single `queue ... from (...)` block.
dimensionality:
  dims: "1:8"           # or a list, e.g. [1, 2, 3, 4, 6, 8]
  n_restarts: 10
  # Purely a post-hoc penalty on *which dimension* gets flagged best_d --
  # unlike norm_penalty above, this never changes the fits themselves.
  # Left unset here so it defaults to norm_penalty's value (see
  # estimate_dimensionality()'s best_d_norm_penalty argument); uncomment
  # to make best_d selection use a different amount of outlier-aversion
  # than the fits themselves used.
  # best_d_norm_penalty: 0
  # max_epochs: 20000   # e.g. run the search faster than the final fit

# --- Stage 2: learning curve at the dimension selected in stage 1 ----------
# One Condor job per (fraction, restart) pair -- ceil(1/by) * n_restarts jobs.
learning_curve:
  by: 0.1
  n_restarts: 10
  # max_epochs: 50000

# --- Stage 3: final embedding, fit on the full dataset ----------------------
# A single Condor job. Unlike stage 2's fraction = 1.0 fits (which still
# hold out a test set for evaluation), this is meant as the production
# embedding, so give it a generous epoch budget if you can afford to.
final_fit:
  # max_epochs: 100000
  resources:
    request_cpus: 1
    request_memory: 8GB
    request_disk: 8GB
