# ---------------------------------------------------------------------------
# tripletTools choice-model recovery-sweep Condor workflow configuration
#
# Copy this file, edit the fields below, and pass it as the single argument
# to condor_recovery_sweep_workflow.py on the submit node:
#
#   python3 condor_recovery_sweep_workflow.py my_params.yml
#
# No R installation is needed on the submit node -- only Python 3 and
# PyYAML (pip install --user pyyaml). Every embedding fit runs inside the
# tripletTools container image via HTCondor's container universe.
#
# What this does: generates `n_replicates` independent synthetic
# ground-truth embeddings, each with its own simulated triplet dataset
# under every value in `alphas` (the "generating" choice model), then fits
# a recovery embedding from EVERY (replicate, generating alpha, fitting
# alpha) combination -- n_replicates * len(alphas)^2 completely independent
# fits -- and scores each one's recovery error (Procrustes distance)
# against that replicate's own known ground truth. Answers whether
# recovery is always best when the fitting choice model matches the one
# that generated the data, how fast it degrades off that diagonal, and
# (via the replicates) whether any of that holds up across more than one
# random draw rather than being a single simulation's noise.
#
# alpha is one continuum, not a set of unrelated methods: finite alpha is
# a Student-t kernel (alpha=1 is exactly Crowd Kernel with mu=1); alpha=Inf
# is the exact Gaussian/gamma=0.5 limit.
# ---------------------------------------------------------------------------

# Directory (on the submit node) where all outputs are written:
# stage0_simulate/ (per-replicate ground truth + per-generating-alpha
# triplet CSVs), stage1_fit/ (per-fit outputs), plus results_long.csv
# (every individual fit's result -- the right input for any real
# statistical comparison across replicates), error_matrix_mean.csv /
# error_matrix_sd.csv (a quick-look generating x fitting grid, averaged
# over replicates), and run_manifest.txt at the top level. Created if it
# doesn't exist.
output_dir: condor_recovery_sweep_output

# Number of independent replicate simulations. Each replicate draws its
# own ground-truth embedding and its own triplets under every alpha, so
# this is what turns a single noisy point estimate per (generating,
# fitting) cell into a distribution -- needed before trusting any specific
# claim about which off-diagonal cells beat the matched-model diagonal.
# Total fits = n_replicates * len(alphas)^2 (20 * 8^2 = 1280 with the
# defaults below).
n_replicates: 20

# Embedding dimensionality. Used for BOTH the synthetic ground truth
# itself and every recovery fit -- get.rep.dist()'s Procrustes comparison
# requires the two to share a dimensionality, so changing this changes
# the ground truth's geometry too, not just the fits.
d: 3

# The alpha continuum, used as BOTH the generating and fitting choice
# model grid (every value is crossed with every other). Use `.inf` (not
# `Inf`/`inf`) for YAML's infinity literal. Calibrated cost: at the
# max_epochs/tol_window below, one fit took ~46 minutes locally, so with
# n_replicates=20 the full 1280 fits is roughly 980 hours of total fitting
# work -- entirely why this is a Condor job, not a local loop: with enough
# execute slots running concurrently, wall-clock is however long the
# slowest single fit takes, not the sum of all of them.
alphas: [0.1, 0.5, 1, 2, 5, 10, 20, .inf]

# Triplets simulated per generating alpha (shared across all fitting
# alphas tested against that generating alpha's data).
n_triplets_per_gen: 4000

# Fraction of each generating alpha's triplets held out as a test set for
# early stopping, identical across every fit.
test_frac: 0.1

# Base random seed. Each replicate r gets its own seed range,
# seed + r*100000, comfortably separated from every other replicate's;
# within a replicate, ground-truth generation uses that replicate's base
# seed directly, each generating alpha's triplet simulation uses
# base + 1000 + its position in `alphas`, and each fit's
# initialization/training uses base + 100*(generating position) +
# (fitting position) -- so every one of the n_replicates * len(alphas)^2
# fits gets a distinct, reproducible seed.
seed: 1

# --- Synthetic ground-truth embedding -----------------------------------
# Hierarchical/multi-scale, at the dimensionality set by `d` above:
# n_super widely separated superclusters, each with n_sub_per_super
# moderately separated subclusters, each with n_items_per_sub tightly
# packed items -- producing small, medium, and large true pairwise
# distances so choice models with different tail behavior have the best
# chance to diverge. Total items = n_super * n_sub_per_super *
# n_items_per_sub (defaults below: 50).
synthetic_embedding:
  n_super: 5
  n_sub_per_super: 2
  n_items_per_sub: 5
  super_radius: 12
  sub_offset: 2.5
  within_sd: 0.3

# --- HTCondor settings -------------------------------------------------------
condor:
  # docker:// reference to the tripletTools container image, built and
  # published by .github/workflows/docker-publish.yml at the repo root.
  # Every fit job runs inside this image via universe = container -- no R,
  # conda, or tripletTools installation is assumed on whatever execute node
  # the job lands on.
  container_image: docker://ghcr.io/knowledge-and-concepts-lab/triplettools:latest
  resources:
    request_cpus: 1
    request_memory: 4GB
    request_disk: 8GB   # covers the pulled/unpacked container image

  # Optional: cap how many jobs run/finish concurrently, by submitting them
  # in sequential chunks of this size instead of all at once. Unset
  # (default) submits everything together. A real deployment (627
  # participants, 100 permutations, different workflow) saw jobs complete
  # with a clean exit code but an empty output file when ~100 jobs finished
  # within the same narrow window -- consistent with the file-transfer path
  # getting overloaded, not a script bug (every fit is automatically
  # retried regardless, up to 5 times, whether or not this is set -- see
  # vignette("condor_workflows_vignette")'s troubleshooting section).
  # Setting batch_size reduces how often that retry is even needed by
  # capping the size of any single completion burst; it costs some
  # wall-clock time if the pool has free slots to spare, since batches run
  # sequentially rather than all in parallel.
  # batch_size: 25

# --- Embedding-fit settings ---------------------------------------------------
# Applied to every one of the n_replicates * len(alphas)^2 fits. Calibrated
# locally (15000/1500 still hit the epoch ceiling with test accuracy still
# improving; 60000/3000 plateaus, ~46 min/fit on CPU) -- adjust if your
# own calibration run on the execute nodes' hardware suggests otherwise.
max_epochs: 60000
tolerance: 1e-4
tol_window: 3000
device: cpu           # execute nodes in the general CHTC pool have no GPU
