name: Build and publish container image

# Rebuilds whenever anything that affects the installed environment
# changes (R/Python source, dependency list, or the Dockerfile itself),
# or on demand via workflow_dispatch. Pure documentation/test-only changes
# elsewhere in the repo do NOT trigger a rebuild, since installing
# conda/PyTorch from scratch takes several minutes.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'R/**'
      - 'inst/python/**'
      - 'inst/requirements.txt'
      - 'DESCRIPTION'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Handles lowercasing the org/repo name (Docker registries require
      # lowercase) and tagging: `latest` on main, plus the commit SHA.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRIPLETTOOLS_REF=${{ github.sha }}
